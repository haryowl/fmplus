services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fmplus
      POSTGRES_PASSWORD: fmplus
      POSTGRES_DB: fmplus
    ports:
      - "5433:5432"
    volumes:
      - fmplus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmplus -d fmplus"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fmplus
      MINIO_ROOT_PASSWORD: fmplussecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fmplus_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 fmplus fmplussecret;
      mc mb -p local/fmplus-pom || true;
      exit 0;
      "

volumes:
  fmplus_pg:
  fmplus_minio:
